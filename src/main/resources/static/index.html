<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de informes PDF</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; color: #222; }
        .card { max-width: 760px; margin: auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px #0002; }
        h1 { margin-top: 0; font-size: 24px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 18px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        textarea { min-height: 70px; }
        .full { grid-column: 1 / -1; }
        button { margin-top: 18px; padding: 11px 20px; font-size: 15px; border: 0; border-radius: 5px; background: #1665c1; color: #fff; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #estado { margin-top: 14px; font-size: 14px; }
        .ok { color: #16713a; } .error { color: #b00020; white-space: pre-wrap; }
        a { color: #1665c1; }
    </style>
</head>
<body>
<div class="card">
    <h1>Generador de informe de afirmado</h1>
    <p>Completa los datos y descarga el informe en PDF (o Word). Estado del servicio:
        <a href="/api/health" target="_blank">/api/health</a></p>

    <form id="form">
        <div class="grid">
            <div><label>Título</label><input name="titulo" value="INFORME DE ENSAYO DE MATERIAL"></div>
            <div><label>Dosificación</label><input name="dosificacion"></div>
            <div><label>Obra</label><input name="obra"></div>
            <div><label>Tipo de proyecto</label><input name="tipoProyecto"></div>
            <div><label>Cantera / nombre del proyecto</label><input name="nombreProyecto"></div>
            <div><label>Solicita</label><input name="solicita"></div>
            <div><label>Realizado por</label><input name="realizadoPor"></div>
            <div><label>Fecha</label><input name="fecha" type="date"></div>
            <div><label>Lugar</label><input name="lugar"></div>
            <div><label>Distrito</label><input name="distrito"></div>
            <div><label>Provincia</label><input name="provincia"></div>
            <div><label>Departamento</label><input name="departamento"></div>
            <div><label>Formato</label>
                <select name="formato"><option value="pdf">PDF</option><option value="docx">Word (.docx)</option></select>
            </div>
            <div class="full"><label>Conclusión</label><textarea name="conclusion"></textarea></div>
        </div>
        <button type="submit" id="btn">Generar y descargar</button>
    </form>
    <div id="estado"></div>
    <p style="font-size:12px;color:#666;margin-top:24px">
        Para adjuntar portada, mapa, curva, anexos y panel fotográfico usa el endpoint
        <code>POST /api/informe/generar</code> con multipart/form-data.
    </p>
</div>

<script>
    const campos = ['titulo','dosificacion','obra','tipoProyecto','nombreProyecto','solicita',
        'realizadoPor','fecha','lugar','distrito','provincia','departamento','conclusion'];

    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const estado = document.getElementById('estado');
        const btn = document.getElementById('btn');
        estado.textContent = 'Generando informe…';
        estado.className = '';
        btn.disabled = true;

        const datos = new URLSearchParams();
        campos.forEach(k => datos.append(k, form.elements[k].value || ''));

        const body = new FormData();
        body.append('datos', datos.toString());
        body.append('formato', form.elements['formato'].value);

        try {
            const res = await fetch('/api/informe/generar', { method: 'POST', body });
            if (!res.ok) throw new Error((await res.text()) || ('Error HTTP ' + res.status));
            const blob = await res.blob();
            const disp = res.headers.get('Content-Disposition') || '';
            const nombre = /filename="?([^";]+)"?/.exec(disp)?.[1]
                || (form.elements['formato'].value === 'pdf' ? 'informe.pdf' : 'informe.docx');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
            a.remove(); URL.revokeObjectURL(url);
            estado.textContent = 'Listo: ' + nombre + ' (' + blob.size + ' bytes)';
            estado.className = 'ok';
        } catch (err) {
            estado.textContent = 'No se pudo generar el PDF:\n' + err.message;
            estado.className = 'error';
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
