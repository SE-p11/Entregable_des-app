spring.application.name=pdf-backend

# Tamaño máximo de archivos (los informes con fotos pesan bastante)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# Ruta de LibreOffice. Si lo dejas como "soffice" el programa intenta
# encontrarlo solo en las rutas habituales de Windows, Linux y Mac.
# Si no lo encuentra, pon la ruta completa, por ejemplo en Windows:
# libreoffice.path=C:/Program Files/LibreOffice/program/soffice.exe
libreoffice.path=soffice
